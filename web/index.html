<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: sin esto, env(safe-area-inset-*) devuelve cero y el
         contenido queda debajo de la barra de estado del celular. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icono-192.png" />
    <meta name="theme-color" content="#ffffff" />
    <title>WhatsWV</title>

    <!--
      El tema se decide antes de que cargue React, no después: si esperara al
      primer render, el que tiene la bandeja en oscuro vería un destello blanco
      en cada arranque. Son cuatro líneas acá para no pagar eso.

      La clave y la clase son las mismas que usa src/tema.ts.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('whatswv:tema') || 'automatico';
          var oscuro =
            t === 'oscuro' ||
            (t === 'automatico' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) {
            document.documentElement.classList.add('oscuro');
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#111a2b');
          }
        } catch (e) {
          /* sin localStorage: queda en claro */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
